name: Check proposal

# Runs the site's tests and build on every pull request into main — including when
# the owner edits a monthly proposal on GitHub before merging — so a mistake shows
# as a red ✗ on the pull request instead of reaching the live site. Never deploys.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Build
        run: python build.py

      - name: Past dates still in write-ups
        continue-on-error: true
        run: python updater/stale.py --summary >> "$GITHUB_STEP_SUMMARY"
